<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리포트 — Report Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/admin/home.css">
</head>
<body>
  <main class="page">
    {{NAV}}
    <header class="home-hero" data-testid="manager-report-focus">
      <div>
        <p class="eyebrow">REPORT LIBRARY</p>
        <h1 id="summaryExplorerTitle">리포트</h1>
        <p class="sub">방송 요약을 최신순으로 찾고 편집 화면으로 들어갑니다. 저장과 공개는 상세 화면에서 계속 분리됩니다.</p>
      </div>
    </header>

    <section class="explorer" aria-labelledby="summaryExplorerTitle">
      <div class="toolbar" role="search">
        <label class="search-field" for="search"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="제목, 스트리머, 영상번호로 찾기"><kbd>/</kbd></label>
        <a class="deep-search-link" href="/search">요약 본문까지 검색</a>
      </div>
      <div id="streamerBar" class="streamer-bar" aria-label="스트리머 필터"></div>
      <div class="list-status-row">
        <div id="meta" class="meta" role="status" aria-live="polite">최근 요약을 불러오는 중...</div>
        <div class="explorer-actions"><span class="sort-note">최신순 ↓</span><button id="bundleModeBtn" type="button" aria-pressed="false">여러 요약 묶기</button><button id="reloadBtn" type="button">새로고침</button></div>
      </div>
      <div id="error" class="error" role="alert"></div>
      <div id="list" class="summary-list" aria-live="polite" aria-busy="true"></div>
      <button id="loadMoreBtn" class="load-more" type="button" hidden>요약 더 보기</button>
    </section>

    <section class="bundle-select-panel" aria-labelledby="existingSummaryBundleTitle" data-testid="existing-summary-bundle-panel" hidden>
      <div class="bundle-select-head">
        <div><h2 class="bundle-select-title" id="existingSummaryBundleTitle">선택한 요약 묶기</h2><div class="bundle-select-status" id="bundleSelectStatus" aria-live="polite">요약 2개 이상을 선택하면 미리 볼 수 있습니다.</div></div>
        <div class="bundle-select-actions" aria-label="기존 요약 번들 작업">
          <input class="bundle-select-title-input" id="bundleTitleInput" type="text" placeholder="번들 제목(선택)" aria-label="번들 제목">
          <button id="bundlePreviewBtn" type="button" data-testid="existing-summary-bundle-preview" disabled>미리보기</button>
          <button id="bundleCreateBtn" type="button" data-testid="existing-summary-bundle-create" disabled>번들 만들기</button>
          <button id="bundleClearBtn" type="button" disabled>선택 해제</button>
        </div>
      </div>
      <div class="bundle-preview" id="bundlePreviewPanel" hidden></div>
    </section>
  </main>
  <script src="/static/admin/home.js"></script>
</body>
</html>
