    <rect x="251" y="42" width="67" height="27" rx="13.5" fill="#343653"/>
    <text x="284.5" y="60" text-anchor="middle" fill="#c7c7f3" font-size="13" font-weight="600">3.0.3</text>
    <text x="48" y="137" fill="#ffffff" font-size="49" font-weight="750" letter-spacing="-1.7">Read. Understand. Edit.</text>
    <text x="50" y="174" fill="#b6c1d8" font-size="19">Turn original sources into an evidence-grounded VOD report.</text>
    <g font-size="13" font-weight="600" fill="#d8e4f8">
