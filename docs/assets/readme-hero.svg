<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">CVA-Loki 3.0.3 — Read. Understand. Edit.</title>
  <desc id="desc">From VOD sources through current Codex authorship to an editable report. GPU-aware installation, native Codex plugin and highlight frames.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a31"/><stop offset="1" stop-color="#211d3a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#b6a0ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bac8f7" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <path d="M0 337H1200" stroke="url(#accent)" stroke-width="6"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
