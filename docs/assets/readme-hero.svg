      <path d="M71 77L91 93L71 109Z" fill="#89dfed"/>
      <rect x="157" y="58" width="178" height="7" rx="3.5" fill="#a8b8d2"/><rect x="157" y="76" width="196" height="6" rx="3" fill="#4c5b75"/><rect x="157" y="91" width="166" height="6" rx="3" fill="#4c5b75"/>
      <rect x="157" y="115" width="78" height="20" rx="10" fill="#343355"/><text x="196" y="129" text-anchor="middle" fill="#c8bdf9" font-size="10">D1 / D2</text>
