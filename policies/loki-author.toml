# Extension Policy Engine rules for @google/gemini-cli (Tier 2: ask_user / deny only)
# Note: Extension policies intentionally forbid `allow` rules. See docs/llm-guides/GEMINI_CLI_SETUP.md
# for an optional user-tier ~/.gemini/policies/ snippet if you want auto-approval for offline reads.

[[rule]]
toolName = "run_shell_command"
commandPrefix = "source_acquire.py"
decision = "ask_user"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "gemini-api"
decision = "ask_user"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "(?:NID_AUT|NID_SES|\\.env|credentials|cookies)"
decision = "deny"
denyMessage = "Loki policy forbids accessing browser credentials, cookies, or secret environment files."
priority = 200
